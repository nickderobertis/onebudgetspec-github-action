schema_version = 2
probe = "scripts/release-probe.sh"

[[target]]
name = "crate"
id = "crate:onebudgetspec-github-action"
manifest = "crates/onebudgetspec-github-action/Cargo.toml"
what = "The direct tool, installed through cargo. Published last, so its version also proves that version's action payload is usable."
published_by = ".github/workflows/release.yml crate job via scripts/publish-crate.sh."

[[target]]
name = "github-release"
id = "github-release:nickderobertis/onebudgetspec-github-action"
manifest = "action.yml"
what = "The action's payload for one immutable version: action.yml, the driver and plugin archives, and their checksums."
published_by = ".github/workflows/release.yml payload job via scripts/publish-payload.sh."
