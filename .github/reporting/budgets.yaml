schema_version: 1
budgets:
  - id: action-report-rest-requests-per-run
    description: >-
      Budget job GitHub API requests per run, REST and GraphQL with retries and pages: one complete PR
      or base job with 100 budget rows, one rolling file of 20 commits and every runnable ordinary
      command's reads. Artifact and storage transfers are reported beside it and not counted in it.
    labels: [ci-report]
    measure: reported
    command: [onebudgetspec-github-action, telemetry, --metric, report-github-api-requests-per-run, --input, .telemetry/report-job.json]
    unit: requests
    direction: max
    threshold: 20
