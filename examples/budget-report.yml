# The one budgets job, added to a repository's existing workflow: after its predecessors, on every
# pull request and base push. It adds no build or test of its own. `uses:` pins a release's exact version.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  test:
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  budgets:
    needs: [build, test]
    # Runs whatever its predecessors did, so a failed test still gets its budget report.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    # One writer per pull request: the host has no atomic comment create.
    concurrency:
      group: budget-report-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      # Full history: local git proves each saved base commit's ancestry.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: nickderobertis/onebudgetspec-github-action@v0.2.0
        with:
          token: ${{ github.token }}
          # What the test jobs saved with `onebudgetspec check --save-results` and uploaded with
          # `if: always()`: those budgets show that figure, and their commands do not run here.
          saved-results-artifacts: budget-check-results-*
          # Budgets a pull request cannot measure leave the table, and one line counts them.
          omit-labels: not-measured-on-pr
