# release-plz versions, tags and cuts the GitHub Release; .github/workflows/release.yml publishes.
[workspace]
publish = false
release_always = true
features_always_increment_minor = true
# Only release-worthy commits open a release pull request; its own `chore: release`
# commit is not one.
release_commits = "^(feat|fix|perf|refactor|build)(\\([^)]+\\))?!?:"
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
semver_check = false

[[package]]
name = "onebudgetspec-github-action"
changelog_path = "crates/onebudgetspec-github-action/CHANGELOG.md"

# Test-only workspace members: never versioned, tagged or published.
[[package]]
name = "onebudgetspec-github-action-e2e"
release = false

[[package]]
name = "repo-checks"
release = false

[changelog]
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^build", group = "Build" },
  { message = ".*", skip = true },
]
